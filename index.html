<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>Ecomondo 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0F6E56">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ecomondo">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="top-row">
      <button id="back" class="iconbtn hidden" aria-label="Retour">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="titles">
        <h1 id="title">Ecomondo 2026</h1>
        <div id="subtitle" class="subtitle"></div>
      </div>
      <button id="searchBtn" class="iconbtn" aria-label="Rechercher">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button id="gear" class="iconbtn" aria-label="Réglages">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
    <div id="searchbar" class="searchbar hidden">
      <input id="q" type="search" placeholder="Rechercher une entreprise, un contact, un stand…" autocomplete="off" autocorrect="off" autocapitalize="off">
      <button id="qClose" class="linkbtn">Fermer</button>
    </div>
    <div id="status" class="status hidden"></div>
  </header>

  <main id="main"></main>

  <nav id="tabs" aria-label="Sections">
    <button data-tab="plan"><svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 11l2.5 2.5L16 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 16h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Plan</span></button>
    <button data-tab="delegation"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="9.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19c.5-3.3 2.8-5 5.5-5s5 1.7 5.5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 19c.3-2.2 1.6-3.6 3.5-3.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Délégation</span></button>
    <button data-tab="expo"><svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6v10H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 20v-6h6v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Exposants</span></button>
    <button data-tab="contacts"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="11" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 16c.4-1.6 1.6-2.4 3-2.4s2.6.8 3 2.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M14 10h4M14 13h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Contacts</span></button>
    <button data-tab="rapport"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Rapport</span></button>
  </nav>

  <div id="overlay" class="overlay hidden" role="dialog" aria-live="polite">
    <div class="overlay-box">
      <div class="spinner"></div>
      <div id="overlayText">Lecture de la carte…</div>
      <div class="bar"><div id="overlayBar"></div></div>
      <button id="overlayCancel" class="linkbtn">Annuler</button>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <input id="camIn" type="file" accept="image/*" capture="environment" class="hidden">
  <input id="galIn" type="file" accept="image/*" class="hidden">
  <input id="jsonIn" type="file" accept="application/json,.json" class="hidden">
  <input id="planIn" type="file" accept=".json,.xlsx,.xls,.csv,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" class="hidden">
  <input id="catIn" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" class="hidden">
</div>
<script src="lib/xlsx.full.min.js" defer></script>
<script src="lib/tesseract.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
